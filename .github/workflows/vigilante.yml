name: Vigilante NinStock

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (GitHub a veces se atrasa unos minutos)
  workflow_dispatch:         # botón "Run workflow" para probar a mano
    inputs:
      prueba:
        description: "Mandar notificación de prueba"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Revisar productos
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ inputs.prueba }}" = "true" ]; then
            python watcher.py --test
          else
            python watcher.py
          fi

      - name: Guardar estado
        run: |
          git config user.name "ninstock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json feed.json
          git diff --staged --quiet || (git commit -m "Estado actualizado" && git push)
